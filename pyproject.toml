[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pycip4"
version = "0.1.0"
description = "A modern, high-performance Python library for CIP4 JDF, XJDF, JMF and PrintTalk print-workflow automation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ramiro Ramirez Garcia", email = "ramiro.ramirez.garcia85@gmail.com" },
]
keywords = [
    "cip4",
    "jdf",
    "xjdf",
    "jmf",
    "printtalk",
    "print-workflow",
    "prepress",
    "mis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Printing",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.6,<3.0",
    "lxml>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "aiohttp>=3.9,<4.0",
    "anyio>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "black>=24.0",
    "lxml-stubs>=0.5",
]

[project.urls]
Homepage = "https://github.com/bennets-graphics/pycip4"
Documentation = "https://github.com/bennets-graphics/pycip4#readme"
Issues = "https://github.com/bennets-graphics/pycip4/issues"

[tool.hatch.build.targets.wheel]
packages = ["pycip4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# B008: fluent builders legitimately call functions in default-arg position.
# RUF022: __all__ is deliberately grouped by subsystem, not alphabetized.
ignore = ["B008", "RUF022"]

[tool.ruff.lint.isort]
known-first-party = ["pycip4"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = true
warn_required_dynamic_aliases = true
